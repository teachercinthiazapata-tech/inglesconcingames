<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clase 63 - Vocabulary Memory Game</title>
<style>
  :root{
    --navy:#1B2A4A;
    --orange:#B5651D;
    --gold:#8A5A00;
    --green:#2E7D32;
    --cream:#FBF7F0;
    --card-back:#1B2A4A;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:linear-gradient(135deg,#FBF7F0 0%,#F0E6D6 100%);
    margin:0;
    padding:20px;
    color:#222;
  }
  .wrap{max-width:980px;margin:0 auto;}
  h1{color:var(--navy);text-align:center;margin-bottom:4px;font-size:28px;}
  .subtitle{text-align:center;color:var(--gold);font-style:italic;margin-bottom:6px;}
  .instructions{
    text-align:center;
    background:#fff;
    border-left:5px solid var(--orange);
    padding:12px 18px;
    border-radius:8px;
    margin-bottom:20px;
    max-width:700px;
    margin-left:auto;
    margin-right:auto;
    font-size:15px;
  }
  .stats{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-bottom:18px;
    font-weight:bold;
    color:var(--navy);
    font-size:18px;
  }
  .stats span.value{color:var(--orange);}
  #board{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    max-width:900px;
    margin:0 auto;
  }
  @media (max-width:720px){
    #board{grid-template-columns:repeat(3,1fr);}
  }
  .card{
    aspect-ratio:3/4;
    perspective:1000px;
    cursor:pointer;
  }
  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.5s;
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card.matched .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px;
    font-size:13px;
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
  }
  .card-back{
    background:linear-gradient(145deg,var(--navy),#2c4270);
    color:#fff;
    font-size:26px;
    font-weight:bold;
  }
  .card-front{
    background:#fff;
    color:var(--navy);
    transform:rotateY(180deg);
    border:2px solid #eee;
    font-weight:600;
    line-height:1.3;
  }
  .card.word .card-front{
    background:#fff8ec;
    border-color:var(--orange);
    color:var(--orange);
    font-weight:bold;
    font-size:15px;
  }
  .card.def .card-front{
    background:#f0f6ff;
    border-color:var(--navy);
    font-size:12px;
  }
  .card.matched .card-front{
    background:#e8f5e9;
    border-color:var(--green);
    color:var(--green);
  }
  .card.shake .card-inner{
    animation:shake 0.4s;
  }
  @keyframes shake{
    0%,100%{transform:rotateY(180deg) translateX(0);}
    25%{transform:rotateY(180deg) translateX(-6px);}
    75%{transform:rotateY(180deg) translateX(6px);}
  }
  #winScreen{
    display:none;
    text-align:center;
    margin-top:30px;
    background:#fff;
    padding:30px;
    border-radius:14px;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
    max-width:500px;
    margin-left:auto;
    margin-right:auto;
  }
  #winScreen h2{color:var(--green);}
  button{
    background:var(--orange);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    margin-top:14px;
  }
  button:hover{background:var(--gold);}
  .quote-box{
    display:none;
    background:#fff8ec;
    border-left:4px solid var(--orange);
    padding:10px 14px;
    border-radius:8px;
    max-width:700px;
    margin:16px auto 0 auto;
    font-size:14px;
    font-style:italic;
    color:var(--gold);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vocabulary Memory Game</h1>
  <div class="subtitle">The Good Place, Episode 9 &middot; Clase 63 &middot; inglés con cin</div>
  <div class="instructions">Flip two cards at a time. Find the word and its matching meaning. Match all 9 pairs to win!</div>
  <div class="stats">
    <div>Pairs found: <span class="value" id="pairsFound">0</span> / 9</div>
    <div>Attempts: <span class="value" id="attempts">0</span></div>
  </div>
  <div id="board"></div>
  <div class="quote-box" id="quoteBox"></div>
  <div id="winScreen">
    <h2>Great job! You matched all 9 words!</h2>
    <p id="finalStats"></p>
    <button onclick="initGame()">Play Again</button>
  </div>
</div>

<script>
const pairs = [
  { word: "to botch something", def: "to do something badly, making a serious mistake", quote: '"I guess you really botched that one, eh?" — Trevor to Michael' },
  { word: "to placate someone", def: "to make someone calmer or less angry", quote: '"Surely this magnificent house will placate them." — Tahani' },
  { word: "to segue into something", def: "to move smoothly from one topic to another", quote: '"We\'re going to subtly segue into negotiation." — Michael' },
  { word: "to explain something away", def: "to give a reason that makes a mistake seem less serious", quote: '"That trauma, it can explain away a lot of behavior." — Fake Eleanor' },
  { word: "to stand up for yourself", def: "to defend your own rights or opinions", quote: '"No, you need to stand up for yourself." — Tahani to Michael' },
  { word: "to give in to something", def: "to stop resisting and finally agree, often unwillingly", quote: '"Give in to all of their demands..." — Michael\'s plan' },
  { word: "to bring someone aboard", def: "to formally include someone as a member of a team", quote: '"We want to bring you aboard permanently." — office manager to Jason' },
  { word: "severance pay", def: "money a company pays an employee when their job ends", quote: '"Severance pay. Love it." — Jason' },
  { word: "on borrowed time", def: "in a situation that will end soon, even though it hasn\'t yet", quote: '"You\'re on borrowed time, Fake Eleanor." — Trevor' }
];

let cards = [];
let flipped = [];
let matchedCount = 0;
let attempts = 0;
let lock = false;

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initGame(){
  matchedCount = 0;
  attempts = 0;
  flipped = [];
  lock = false;
  document.getElementById('pairsFound').textContent = 0;
  document.getElementById('attempts').textContent = 0;
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('quoteBox').style.display = 'none';

  cards = [];
  pairs.forEach((p, idx) => {
    cards.push({ pairId: idx, type: 'word', text: p.word, quote: p.quote });
    cards.push({ pairId: idx, type: 'def', text: p.def, quote: p.quote });
  });
  shuffle(cards);

  const board = document.getElementById('board');
  board.innerHTML = '';
  cards.forEach((c, i) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'card ' + c.type;
    cardEl.dataset.index = i;
    cardEl.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">?</div>
        <div class="card-face card-front">${c.text}</div>
      </div>
    `;
    cardEl.addEventListener('click', () => flipCard(i));
    board.appendChild(cardEl);
  });
}

function flipCard(i){
  if(lock) return;
  const cardEl = document.querySelector(`.card[data-index="${i}"]`);
  if(cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

  cardEl.classList.add('flipped');
  flipped.push(i);

  if(flipped.length === 2){
    lock = true;
    attempts++;
    document.getElementById('attempts').textContent = attempts;
    const [i1, i2] = flipped;
    const c1 = cards[i1], c2 = cards[i2];
    if(c1.pairId === c2.pairId && c1.type !== c2.type){
      setTimeout(() => {
        document.querySelector(`.card[data-index="${i1}"]`).classList.add('matched');
        document.querySelector(`.card[data-index="${i2}"]`).classList.add('matched');
        matchedCount++;
        document.getElementById('pairsFound').textContent = matchedCount;
        showQuote(c1.quote);
        flipped = [];
        lock = false;
        if(matchedCount === pairs.length){
          setTimeout(showWin, 500);
        }
      }, 600);
    } else {
      const el1 = document.querySelector(`.card[data-index="${i1}"]`);
      const el2 = document.querySelector(`.card[data-index="${i2}"]`);
      el1.classList.add('shake');
      el2.classList.add('shake');
      setTimeout(() => {
        el1.classList.remove('flipped','shake');
        el2.classList.remove('flipped','shake');
        flipped = [];
        lock = false;
      }, 900);
    }
  }
}

function showQuote(q){
  const box = document.getElementById('quoteBox');
  box.textContent = q;
  box.style.display = 'block';
}

function showWin(){
  document.getElementById('winScreen').style.display = 'block';
  document.getElementById('finalStats').textContent = `You found all 9 pairs in ${attempts} attempts.`;
}

initGame();
</script>
</body>
</html>
