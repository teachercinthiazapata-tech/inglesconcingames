<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Used To: Grammar Fill in the Blank</title>
<style>
  :root{
    --navy:#1B2A4A; --peach:#FFE8D6; --mint:#D8F3DC; --coral:#FFD6D6;
    --yellow:#FFF3B0; --purple:#EEE3F8; --purple-strong:#C79EEA;
    --good:#5FAE62; --bad:#E2685F; --muted:#5B7386;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 48px; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at top left,#fff3e8 0,#FBEADA 45%,#f3d9c2 100%);
    color:var(--navy);
  }
  .card{
    width:min(640px,94vw); background:#fff; border-radius:26px; padding:28px 26px 26px;
    box-shadow:0 16px 34px rgba(27,42,74,.16); position:relative; overflow:hidden;
  }
  h1{font-size:1.4rem; margin:0 0 6px; text-align:center;}
  .sub{text-align:center; color:var(--muted); font-size:.95rem; margin:0 0 20px;}
  .progress-wrap{background:var(--peach); border-radius:999px; height:14px; overflow:hidden; margin-bottom:22px;}
  .progress-bar{background:linear-gradient(90deg,#C25FD6,#EE6FA6); height:100%; width:0%; transition:width .35s ease;}
  .question{font-size:1.15rem; font-weight:700; margin:0 0 20px; line-height:1.5;}
  .blank{color:#8A5A00; font-weight:800;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; border:2px solid #F0E3D3; background:#FDF6EF; border-radius:16px;
    padding:13px 16px; font-size:1rem; cursor:pointer; color:var(--navy); transition:.15s ease;
    font-family:inherit;
  }
  .opt:hover{border-color:var(--purple-strong); transform:translateY(-1px);}
  .opt.correct{background:#E4F5E1; border-color:var(--good); color:#245c27; font-weight:700;}
  .opt.incorrect{background:#FBE3E1; border-color:var(--bad); color:#7a2b26; font-weight:700;}
  .opt[disabled]{cursor:default;}
  .feedback{
    margin-top:16px; padding:14px 16px; border-radius:14px; font-size:.95rem; line-height:1.4; display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:#E4F5E1; color:#245c27;}
  .feedback.bad{background:#FBE3E1; color:#7a2b26;}
  .nextBtn{
    margin-top:18px; width:100%; border:none; border-radius:999px; padding:14px; font-size:1.05rem;
    font-weight:700; background:var(--navy); color:#fff; cursor:pointer; display:none;
  }
  .nextBtn.show{display:block;}
  .start-screen, .end-screen{text-align:center;}
  .start-screen p, .end-screen p{color:var(--muted); line-height:1.5;}
  .bigBtn{
    border:none; border-radius:999px; padding:16px 34px; font-size:1.1rem; font-weight:800;
    background:linear-gradient(90deg,#C25FD6,#EE6FA6); color:#fff; cursor:pointer; margin-top:10px;
  }
  .score-circle{
    width:150px; height:150px; border-radius:50%; margin:18px auto; display:flex; align-items:center;
    justify-content:center; flex-direction:column; background:var(--purple); border:6px solid var(--purple-strong);
  }
  .score-circle .num{font-size:2.2rem; font-weight:800; color:#4B2170;}
  .score-circle .lbl{font-size:.8rem; color:#4B2170; font-weight:600;}
  footer{margin-top:18px; text-align:center; color:var(--muted); font-size:.85rem;}
</style>
</head>
<body>

<div class="card" id="card"></div>
<footer>Used to, grammar review</footer>

<script>
const questions = [
  { q:"When I was younger, I ___ in ghosts, but I don't anymore.", options:["used to believe","use to believe","was believing"], correct:0, explain:"Affirmative form: used to plus the base verb, believe." },
  { q:"She ___ coffee when she was a teenager, but now she loves it.", options:["didn't used to like","usedn't to like","didn't use to like"], correct:2, explain:"Negative form: didn't use to, with no extra d on use." },
  { q:"___ you ___ an instrument as a child?", options:["Did, use to play","Did, used to play","Have, use to play"], correct:0, explain:"Question form: Did plus subject plus use to, with no d on use." },
  { q:"They ___ in a small town before moving to the city.", options:["use to live","used to live","were living"], correct:1, explain:"Affirmative form: used to plus the base verb, live." },
  { q:"He ___ reading when he was a student, but now he reads every day.", options:["didn't used to enjoy","not used to enjoy","didn't use to enjoy"], correct:2, explain:"Negative form: didn't use to, with no extra d." },
  { q:"We ___ every summer at the beach when I was a kid.", options:["used to spend","have used to spend","use to spend"], correct:0, explain:"Affirmative form: used to plus the base verb, spend." },
  { q:"I ___ much confidence speaking English, but that's changing now.", options:["hadn't used to have","didn't used to have","didn't use to have"], correct:2, explain:"Negative form: didn't use to, with no extra d on use." },
  { q:"___ she ___ here before she moved abroad?", options:["Was, use to work","Did, used to work","Did, use to work"], correct:2, explain:"Question form: Did plus subject plus use to, with no d on use." },
];

let current = 0;
let score = 0;
let answered = false;

const card = document.getElementById("card");

function renderStart(){
  card.innerHTML = `
    <div class="start-screen">
      <h1>Used To: Grammar Review</h1>
      <p>8 quick questions to practice used to for past habits and states, affirmative, negative and question forms.</p>
      <button class="bigBtn" id="startBtn">START</button>
    </div>
  `;
  document.getElementById("startBtn").addEventListener("click", () => {
    current = 0; score = 0;
    renderQuestion();
  });
}

function renderQuestion(){
  answered = false;
  const item = questions[current];
  const pct = Math.round((current / questions.length) * 100);

  card.innerHTML = `
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <p class="question">Question ${current+1} of ${questions.length}: ${item.q}</p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="nextBtn" id="nextBtn">${current === questions.length-1 ? "SEE MY SCORE" : "NEXT"}</button>
  `;

  const optionsEl = document.getElementById("options");
  item.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = opt;
    btn.addEventListener("click", () => selectOption(i));
    optionsEl.appendChild(btn);
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      renderEnd();
    }
  });
}

function selectOption(i){
  if(answered) return;
  answered = true;
  const item = questions[current];
  const buttons = document.querySelectorAll(".opt");
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if(idx === item.correct) b.classList.add("correct");
    else if(idx === i) b.classList.add("incorrect");
  });

  const fb = document.getElementById("feedback");
  if(i === item.correct){
    score++;
    fb.className = "feedback show good";
    fb.textContent = "Correct! " + item.explain;
  } else {
    fb.className = "feedback show bad";
    fb.textContent = "Not quite. " + item.explain;
  }

  document.getElementById("nextBtn").classList.add("show");
}

function renderEnd(){
  const pct = Math.round((score / questions.length) * 100);
  let msg = "Good effort, review the negative and question forms once more.";
  if(pct >= 80) msg = "Excellent! Used to is really clicking for you.";
  else if(pct >= 60) msg = "Nice work, just a little more practice on the tricky forms.";

  card.innerHTML = `
    <div class="end-screen">
      <h1>All done!</h1>
      <div class="score-circle">
        <div class="num">${score}/${questions.length}</div>
        <div class="lbl">${pct}%</div>
      </div>
      <p>${msg}</p>
      <button class="bigBtn" id="restartBtn">TRY AGAIN</button>
    </div>
  `;
  document.getElementById("restartBtn").addEventListener("click", renderStart);
}

renderStart();
</script>
</body>
</html>
