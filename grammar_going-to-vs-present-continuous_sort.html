<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Sort: Going To vs Present Continuous</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(135deg, #c9b6f0 0%, #b8c9f0 45%, #b6f0d8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    background: #ffffff;
    border-radius: 24px;
    max-width: 640px;
    width: 100%;
    padding: 32px 34px 36px;
    box-shadow: 0 20px 50px rgba(80, 60, 130, 0.25);
  }
  h1 {
    text-align: center;
    color: #5b3fa0;
    margin: 0 0 4px;
    font-size: 1.5em;
  }
  .subtitle {
    text-align: center;
    color: #7a6a99;
    margin: 0 0 20px;
    font-size: 0.95em;
  }
  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #e3d9f7;
    transition: background 0.3s;
  }
  .dot.done { background: #7bd8a8; }
  .dot.current { background: #b79dee; }
  .score-row {
    text-align: center;
    font-weight: 600;
    color: #5b3fa0;
    margin-bottom: 18px;
  }
  .card {
    background: #f5f1fd;
    border-radius: 18px;
    padding: 26px 22px;
    color: #3d2e63;
    font-size: 1.08em;
    line-height: 1.45;
    text-align: center;
    margin-bottom: 22px;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s, opacity 0.25s;
  }
  .card.fly-left {
    transform: translateX(-140%) rotate(-8deg);
    opacity: 0;
  }
  .card.fly-right {
    transform: translateX(140%) rotate(8deg);
    opacity: 0;
  }
  .buckets {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .bucket-btn {
    border: 2.5px solid #dcc3ee;
    background: #fdf9ff;
    border-radius: 16px;
    padding: 18px 12px;
    font-size: 1em;
    font-weight: 700;
    color: #3d2e63;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .bucket-btn:hover { border-color: #7c5cd6; transform: translateY(-2px); }
  .bucket-btn.going-to { color: #5c2e8c; }
  .bucket-btn.present-cont { color: #2f6e4f; }
  .bucket-btn.correct-flash { background: #d7f7e6; border-color: #6ed4a0; }
  .bucket-btn.incorrect-flash { background: #fde3e3; border-color: #f08a8a; }
  .bucket-btn:disabled { cursor: default; opacity: 0.85; }
  .feedback {
    text-align: center;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.92em;
    line-height: 1.4;
    min-height: 20px;
    margin-bottom: 8px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: #eafaf1; color: #2f6e4f; }
  .feedback.incorrect-fb { background: #fdecec; color: #8a3b3b; }
  .final-screen {
    text-align: center;
    padding: 20px 10px;
  }
  .final-screen h2 { color: #5b3fa0; margin-bottom: 8px; }
  .final-score {
    font-size: 2.4em;
    font-weight: 800;
    color: #4fae82;
    margin: 10px 0;
  }
  button.action {
    background: #7c5cd6;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 26px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button.action:hover { background: #6647bd; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <h1>Grammar Sort</h1>
  <p class="subtitle">Going To vs Present Continuous. Tap the correct option for each situation.</p>

  <div class="progress-dots" id="dots"></div>
  <div class="score-row" id="scoreRow">Card 1 of 8</div>

  <div id="sortArea">
    <div class="card" id="cardText"></div>
    <div class="buckets">
      <button class="bucket-btn going-to" id="goingToBtn">GOING TO<br><span style="font-weight:400; font-size:0.85em;">a general intention, not arranged yet</span></button>
      <button class="bucket-btn present-cont" id="presentContBtn">PRESENT CONTINUOUS<br><span style="font-weight:400; font-size:0.85em;">a fixed, already arranged plan</span></button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="final-screen hidden" id="finalScreen">
    <h2>Nice sorting!</h2>
    <div class="final-score" id="finalScoreText"></div>
    <p id="finalMessage"></p>
    <button class="action" id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
const cards = [
  { text: "You already booked a doctor's appointment for Friday morning.", answer: "present-cont",
    explanation: "It's already arranged for a specific time, so present continuous fits best." },
  { text: "You want to travel abroad someday, but nothing is planned yet.", answer: "going-to",
    explanation: "It's a general intention with no arrangement yet, so going to fits best." },
  { text: "You already confirmed coffee with a friend for Saturday at 5.", answer: "present-cont",
    explanation: "A specific day and time are already confirmed, so present continuous fits best." },
  { text: "You've decided to learn Italian, but haven't started planning how.", answer: "going-to",
    explanation: "It's a decided intention with no concrete arrangement, so going to fits best." },
  { text: "Your dentist appointment is confirmed for Tuesday at 10.", answer: "present-cont",
    explanation: "A specific, confirmed time makes present continuous the better fit." },
  { text: "You feel like starting a new hobby, but nothing is arranged yet.", answer: "going-to",
    explanation: "It's just an intention for now, so going to fits best." },
  { text: "You already reserved a table for dinner tonight at 8.", answer: "present-cont",
    explanation: "The reservation is already made for a specific time, so present continuous fits best." },
  { text: "You plan to visit your parents soon, but haven't picked a date.", answer: "going-to",
    explanation: "No specific date is set yet, just a general plan, so going to fits best." },
];

let currentIndex = 0;
let score = 0;
let answered = false;

function buildDots() {
  const dotsEl = document.getElementById("dots");
  dotsEl.innerHTML = "";
  cards.forEach(() => {
    const dot = document.createElement("div");
    dot.className = "dot";
    dotsEl.appendChild(dot);
  });
  updateDots();
}

function updateDots() {
  const dots = document.querySelectorAll(".dot");
  dots.forEach((dot, i) => {
    dot.classList.remove("done", "current");
    if (i < currentIndex) dot.classList.add("done");
    else if (i === currentIndex) dot.classList.add("current");
  });
}

function loadCard() {
  answered = false;
  const item = cards[currentIndex];
  const cardEl = document.getElementById("cardText");
  cardEl.classList.remove("fly-left", "fly-right");
  cardEl.textContent = item.text;
  document.getElementById("scoreRow").textContent = `Card ${currentIndex + 1} of ${cards.length}`;
  document.getElementById("feedback").classList.remove("show", "correct-fb", "incorrect-fb");
  document.getElementById("goingToBtn").disabled = false;
  document.getElementById("presentContBtn").disabled = false;
  document.getElementById("goingToBtn").classList.remove("correct-flash", "incorrect-flash");
  document.getElementById("presentContBtn").classList.remove("correct-flash", "incorrect-flash");
  updateDots();
}

function choose(bucket) {
  if (answered) return;
  answered = true;
  const item = cards[currentIndex];
  const goingToBtn = document.getElementById("goingToBtn");
  const presentContBtn = document.getElementById("presentContBtn");
  const chosenBtn = bucket === "going-to" ? goingToBtn : presentContBtn;
  const correctBtn = item.answer === "going-to" ? goingToBtn : presentContBtn;
  goingToBtn.disabled = true;
  presentContBtn.disabled = true;

  const fb = document.getElementById("feedback");
  fb.textContent = item.explanation;

  if (bucket === item.answer) {
    score++;
    chosenBtn.classList.add("correct-flash");
    fb.classList.add("show", "correct-fb");
    document.getElementById("cardText").classList.add(bucket === "going-to" ? "fly-left" : "fly-right");
  } else {
    chosenBtn.classList.add("incorrect-flash");
    correctBtn.classList.add("correct-flash");
    fb.classList.add("show", "incorrect-fb");
  }

  setTimeout(() => {
    currentIndex++;
    if (currentIndex >= cards.length) {
      showFinal();
    } else {
      loadCard();
    }
  }, 1700);
}

document.getElementById("goingToBtn").addEventListener("click", () => choose("going-to"));
document.getElementById("presentContBtn").addEventListener("click", () => choose("present-cont"));

function showFinal() {
  document.getElementById("sortArea").classList.add("hidden");
  document.getElementById("dots").classList.add("hidden");
  document.getElementById("scoreRow").classList.add("hidden");
  document.getElementById("finalScreen").classList.remove("hidden");
  document.getElementById("finalScoreText").textContent = `${score} / ${cards.length}`;
  let msg = "Solid sorting, you're noticing the difference well.";
  if (score === cards.length) msg = "Perfect score. You've really got this distinction down.";
  else if (score <= 4) msg = "A good first pass. Let's talk through a few of these together.";
  document.getElementById("finalMessage").textContent = msg;
}

document.getElementById("playAgainBtn").addEventListener("click", () => {
  currentIndex = 0;
  score = 0;
  document.getElementById("sortArea").classList.remove("hidden");
  document.getElementById("dots").classList.remove("hidden");
  document.getElementById("scoreRow").classList.remove("hidden");
  document.getElementById("finalScreen").classList.add("hidden");
  buildDots();
  loadCard();
});

buildDots();
loadCard();
</script>
</body>
</html>
