<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin the Question</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(135deg, #c9b6f0 0%, #b8c9f0 45%, #b6f0d8 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card { background: #fff; border-radius: 24px; max-width: 640px; width: 100%; padding: 30px; box-shadow: 0 12px 40px rgba(60,40,100,0.18); text-align: center; }
  h1 { font-size: 24px; color: #4a3b6b; margin-bottom: 4px; }
  .subtitle { color: #7a6f95; font-size: 14px; margin-bottom: 16px; }
  .wheel-wrap { position: relative; width: 300px; height: 300px; margin: 10px auto 18px; }
  .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 30px; z-index: 5; color: #5b3fa0; }
  .wheel {
    width: 300px; height: 300px; border-radius: 50%; position: relative;
    border: 6px solid #5b3fa0;
    background: conic-gradient(#e2d9f5 0deg 60deg, #cfe6fb 60deg 120deg, #d4f4e2 120deg 180deg, #fbe9c9 180deg 240deg, #fbd8e4 240deg 300deg, #e9dcfa 300deg 360deg);
    transition: transform 4s cubic-bezier(0.15, 0.7, 0.1, 1);
    box-shadow: 0 6px 20px rgba(60,40,100,0.2);
  }
  .seg-label { position: absolute; top: 50%; left: 50%; width: 0; height: 0; }
  .seg-label span { position: absolute; transform: translate(-50%, -125px); font-size: 15px; font-weight: 700; color: #4a3b6b; white-space: nowrap; }
  .hub { position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #5b3fa0; z-index: 4; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .btn { display: block; width: 100%; background: #6fcf97; color: white; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .btn:hover { background: #5cbf85; }
  .btn:disabled { background: #b9e5cb; cursor: default; }
  .btn.secondary { background: #efe8fb; color: #5b3fa0; }
  .btn.secondary:hover { background: #ddd0f7; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .question-box { background: #f5f2fc; border-radius: 16px; padding: 20px; margin-bottom: 14px; min-height: 120px; }
  .q-tag { font-size: 12px; color: #9b8fb8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 8px; }
  .q-text { font-size: 20px; color: #4a3b6b; line-height: 1.4; font-weight: 600; }
  .starter { margin-top: 10px; font-size: 14px; color: #7a6f95; font-style: italic; }
  .turn { display: inline-block; margin-bottom: 12px; padding: 6px 14px; border-radius: 20px; background: #d4f4e2; color: #1e6b45; font-weight: 700; font-size: 14px; }
  .turn.cin { background: #fbd8e4; color: #a13a5a; }
  .counter { font-size: 13px; color: #9b8fb8; margin-bottom: 10px; }
  .hidden { display: none !important; }
  .footer { color: #9b8fb8; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>Spin the Question</h1>
  <div class="subtitle">Real questions about your real life</div>

  <div class="wheel-wrap">
    <div class="pointer">&#9660;</div>
    <div class="wheel" id="wheel"></div>
    <div class="hub">?</div>
  </div>

  <div class="turn" id="turn">Your turn!</div>
  <div class="question-box">
    <div class="q-tag" id="qTag">Press Spin to start</div>
    <div class="q-text" id="qText">Spin the wheel and answer in one or two sentences.</div>
    <div class="starter" id="qStarter"></div>
  </div>
  <div class="counter" id="counter">Questions used: 0 / 6</div>

  <div class="btn-row">
    <button class="btn" id="spinBtn" onclick="spin()">Spin!</button>
    <button class="btn secondary" id="resetBtn" onclick="resetAll()">Start over</button>
  </div>
  <div class="footer">Inglés con Cin</div>
</div>

<script>
const items = [
  { tag: "STEP", q: "What is one step you do every morning?", starter: "My first step is to ..." },
  { tag: "APPOINTMENT", q: "Do you have an appointment this week? What is it for?", starter: "I have an appointment on ..." },
  { tag: "DEADLINE", q: "What is a deadline you have this week?", starter: "My deadline is on ..." },
  { tag: "TO RECEIVE", q: "What was the last thing you received? (an email, a message, a package)", starter: "Yesterday I received ..." },
  { tag: "TO CONFIRM", q: "Is there something you always confirm before you go out?", starter: "I always confirm ..." },
  { tag: "DELAY", q: "What delays you most in the morning?", starter: "The thing that delays me is ..." }
];
const labels = ["STEP", "APPOINTMENT", "DEADLINE", "RECEIVE", "CONFIRM", "DELAY"];
let used = [];
let rot = 0;
let spinning = false;
let turnIsStudent = true;

const wheel = document.getElementById("wheel");
labels.forEach((l, i) => {
  const holder = document.createElement("div");
  holder.className = "seg-label";
  holder.style.transform = "rotate(" + (i * 60 + 30) + "deg)";
  const s = document.createElement("span");
  s.textContent = l;
  holder.appendChild(s);
  wheel.appendChild(holder);
});

function spin() {
  if (spinning) return;
  if (used.length >= items.length) used = [];
  const free = items.map((_, i) => i).filter(i => used.indexOf(i) === -1);
  const idx = free[Math.floor(Math.random() * free.length)];
  const target = idx * 60 + 10 + Math.random() * 40;
  const current = ((rot % 360) + 360) % 360;
  const delta = ((360 - target) - current + 360) % 360;
  rot = rot + 360 * 5 + delta;
  spinning = true;
  document.getElementById("spinBtn").disabled = true;
  wheel.style.transform = "rotate(" + rot + "deg)";
  setTimeout(function() { showQuestion(idx); }, 4100);
}

function showQuestion(idx) {
  used.push(idx);
  const it = items[idx];
  document.getElementById("qTag").textContent = it.tag;
  document.getElementById("qText").textContent = it.q;
  document.getElementById("qStarter").textContent = it.starter;
  document.getElementById("counter").textContent = "Questions used: " + used.length + " / " + items.length;
  const t = document.getElementById("turn");
  t.textContent = turnIsStudent ? "Your turn, Justina!" : "My turn!";
  t.className = "turn" + (turnIsStudent ? "" : " cin");
  turnIsStudent = !turnIsStudent;
  spinning = false;
  document.getElementById("spinBtn").disabled = false;
  document.getElementById("spinBtn").textContent = used.length >= items.length ? "Spin again" : "Spin!";
}

function resetAll() {
  if (spinning) return;
  used = [];
  turnIsStudent = true;
  document.getElementById("qTag").textContent = "Press Spin to start";
  document.getElementById("qText").textContent = "Spin the wheel and answer in one or two sentences.";
  document.getElementById("qStarter").textContent = "";
  document.getElementById("counter").textContent = "Questions used: 0 / 6";
  const t = document.getElementById("turn");
  t.textContent = "Your turn!";
  t.className = "turn";
  document.getElementById("spinBtn").textContent = "Spin!";
}
</script>
</body>
</html>
