<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Make & Do Challenge Board</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #ffffff, #beffc7, #f5c46a);
      color: #2f4858;
      text-align: center;
      min-height: 100vh;
      padding: 30px;
    }

    h1 {
      color: #7293a0;
      font-size: 42px;
      margin-bottom: 5px;
    }

    h2 {
      color: #f48d70;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .instructions {
      background: white;
      border-radius: 22px;
      padding: 18px;
      max-width: 850px;
      margin: 0 auto 30px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      font-size: 18px;
      line-height: 1.5;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 25px 18px;
      min-height: 160px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: 4px solid #e08d8d;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .card-number {
      background: #f48d70;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-weight: bold;
      font-size: 22px;
    }

    .card-title {
      font-size: 20px;
      font-weight: bold;
      color: #7293a0;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      inset: 0;
      background-color: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 30px;
      padding: 35px;
      max-width: 750px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: pop 0.25s ease;
      position: relative;
      border: 6px solid #f5c46a;
    }

    @keyframes pop {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal h3 {
      font-size: 32px;
      color: #f48d70;
      margin-top: 0;
    }

    .task {
      font-size: 24px;
      line-height: 1.45;
      margin: 20px 0;
    }

    .example {
      display: none;
      background: #beffc7;
      border-radius: 18px;
      padding: 18px;
      margin-top: 20px;
      font-size: 20px;
      color: #2f4858;
      text-align: left;
    }

    .show-example-btn {
      background: #f48d70;
      color: white;
      border: none;
      border-radius: 18px;
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      margin-right: 10px;
      font-weight: bold;
    }

    .show-example-btn:hover {
      background: #e08d8d;
    }

    .close-btn {
      background: #7293a0;
      color: white;
      border: none;
      border-radius: 18px;
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
    }

    .close-btn:hover {
      background: #f48d70;
    }

    .footer {
      margin-top: 35px;
      font-size: 16px;
      color: #7293a0;
      font-weight: bold;
    }

    strong {
      color: #f48d70;
    }
  </style>
</head>
<body>

  <h1>🎲 Make & Do Challenge Board</h1>
  <h2>Present Simple Review</h2>

  <div class="instructions">
    Choose a card. Read the challenge and answer out loud.  
    Try to use complete sentences.
  </div>

  <div class="board" id="board"></div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <div class="task" id="modalTask"></div>

      <button class="show-example-btn" onclick="toggleExample()">Show example</button>
      <button class="close-btn" onclick="closeModal()">Close card</button>

      <div class="example" id="modalExample"></div>
    </div>
  </div>

  <div class="footer">by @inglesconcin.ok 💜</div>

  <script>
    const cards = [
      {
        title: "Focus & Routine",
        task: `Tell me 3 things you do every week to feel focused using collocations with <strong>make</strong> and <strong>do</strong>.`,
        example: `💡 Example:<br>
        I make time for yoga.<br>
        I do meditation.<br>
        I make progress with my English.`
      },
      {
        title: "Positive + Negative",
        task: `Make ONE positive sentence and ONE negative sentence using:<br><br>
        <strong>make progress</strong><br>
        <strong>do exercise</strong>`,
        example: `💡 Example:<br>
        I make progress every month.<br>
        I don’t do exercise at night.`
      },
      {
        title: "Ask a Question",
        task: `Your friend feels stressed and very busy.<br><br>
        Ask ONE Present Simple question using <strong>make time</strong>.`,
        example: `💡 Example:<br>
        Do you make time for yourself during the week?`
      },
      {
        title: "Correct the Sentence",
        task: `Correct this sentence:<br><br>
        ❌ She don’t make progress.`,
        example: `✅ Correct answer:<br>
        She doesn’t make progress.`
      },
      {
        title: "Question Challenge",
        task: `You should make:<br><br>
        ONE Present Simple question using <strong>make</strong>.<br>
        ONE Present Simple question using <strong>do</strong>.`,
        example: `💡 Example:<br>
        Do you make time for exercise?<br>
        Do you do meditation every day?`
      },
      {
        title: "Fast Reaction Round",
        task: `You will hear a word.<br><br>
        Say <strong>MAKE</strong> or <strong>DO</strong> as fast as possible.`,
        example: `💡 Examples:<br>
        homework → DO<br>
        progress → MAKE<br>
        meditation → DO<br>
        a decision → MAKE`
      },
      {
        title: "Personal Connection",
        task: `What helps you make progress in English?<br><br>
        Try to give a complete answer.`,
        example: `💡 Example:<br>
        Practising every week helps me make progress in English.`
      },
      {
        title: "Choose the Correct Option",
        task: `Choose the correct option:<br><br>
        She ___ meditation every morning.<br><br>
        a) do<br>
        b) does<br>
        c) make<br><br>
        Explain why.`,
        example: `✅ Correct answer:<br>
        She does meditation every morning.<br><br>
        We use <strong>does</strong> because the subject is <strong>she</strong>.`
      },
      {
        title: "Give Advice",
        task: `Your friend feels unmotivated and stressed.<br><br>
        Give 2 recommendations using the vocabulary you learnt.`,
        example: `💡 Example:<br>
        You should make time to relax.<br>
        You can do meditation before work.`
      },
      {
        title: "Two Truths and One Lie",
        task: `Create 2 true sentences and 1 false sentence using:<br><br>
        <strong>make time</strong><br>
        <strong>do exercise</strong><br>
        <strong>make a decision</strong><br><br>
        Your teacher will guess the lie!`,
        example: `💡 Example:<br>
        I make time for yoga every week.<br>
        I do exercise at midnight.<br>
        I made an important decision last month.`
      }
    ];

    const board = document.getElementById("board");

    cards.forEach((card, index) => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="card-number">${index + 1}</div>
        <div class="card-title">${card.title}</div>
      `;
      div.onclick = () => openModal(index);
      board.appendChild(div);
    });

    function openModal(index) {
      document.getElementById("modalTitle").innerText = cards[index].title;
      document.getElementById("modalTask").innerHTML = cards[index].task;
      document.getElementById("modalExample").innerHTML = cards[index].example;
      document.getElementById("modalExample").style.display = "none";
      document.querySelector(".show-example-btn").innerText = "Show example";
      document.getElementById("modal").style.display = "flex";
    }

    function toggleExample() {
      const exampleBox = document.getElementById("modalExample");
      const button = document.querySelector(".show-example-btn");

      if (exampleBox.style.display === "none" || exampleBox.style.display === "") {
        exampleBox.style.display = "block";
        button.innerText = "Hide example";
      } else {
        exampleBox.style.display = "none";
        button.innerText = "Show example";
      }
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("modal");
      if (event.target === modal) {
        closeModal();
      }
    };
  </script>

</body>
</html>
