<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Map Challenge: Muscles and Body Parts</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(160deg, #F6D9C4, #CDEAE0); min-height: 100vh; padding: 20px; color: #1F3864; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { text-align: center; font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { text-align: center; margin: 0 0 12px; color: #4a5a75; }
  .top { display: flex; justify-content: space-between; background: #1F3864; color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: bold; margin-bottom: 12px; }
  .panel { background: #FFFBF4; border-radius: 16px; padding: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); text-align: center; }
  .prompt { font-size: 1.3rem; font-weight: bold; margin: 4px 0 8px; min-height: 1.8em; }
  .prompt small { display: block; font-size: 0.85rem; color: #E8836B; font-weight: normal; }
  svg { width: 100%; max-width: 560px; height: auto; background: #fff; border-radius: 12px; }
  .zone { fill: #f3c9b0; stroke: #8a5a44; stroke-width: 1.5; cursor: pointer; transition: fill 0.15s; }
  .zone:hover { fill: #f7a98a; }
  .deco { fill: #ead1bf; stroke: #b8977f; stroke-width: 1; }
  .zone.right { fill: #7fd1a0; }
  .zone.wrong { fill: #f08a84; }
  .zone.pulse { animation: pulse 0.8s infinite; }
  @keyframes pulse { 0% { fill: #f3c9b0; } 50% { fill: #ffd54a; } 100% { fill: #f3c9b0; } }
  .lbl { font-size: 13px; fill: #4a5a75; text-anchor: middle; font-weight: bold; }
  .fb { font-weight: bold; min-height: 2.4em; margin: 8px 0; line-height: 1.4; }
  .good { color: #3aa76d; }
  .bad { color: #d1504a; }
  .bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  button { background: #1F3864; color: #fff; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; }
  button.alt { background: #fff; color: #1F3864; border: 2px solid #1F3864; }
  .hidden { display: none !important; }
  .big { font-size: 2.6rem; margin: 8px 0; }
  .wordcard { display: inline-block; background: #fff3c4; border: 2px solid #f2b84b; border-radius: 12px; padding: 6px 16px; margin-top: 4px; }
  .wordcard .ipa { display: block; font-size: 1rem; color: #4a5a75; font-weight: normal; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Body Map Challenge</h1>
  <p class="sub">Listen and tap the right part of the body</p>
  <div class="top"><span id="stage">Ready?</span><span id="score">Score: 0</span></div>
  <div class="panel" id="panel"></div>
</div>
<script>
var NAMES = { fNeck: "neck", fShoulders: "shoulders", fChest: "chest", fAbs: "core (abs)", fElbows: "elbows", fWrists: "wrists", fHips: "hips", fThighs: "thighs (quadriceps)", fKnees: "knees", fAnkles: "ankles", bBlades: "shoulder blades", bSpine: "spine", bLower: "lower back", bGlutes: "glutes", bHams: "hamstrings", bCalves: "calves" };
var PROMPTS = [
  { say: "neck", zone: "fNeck", show: true }, { say: "shoulders", zone: "fShoulders", show: true }, { say: "chest", zone: "fChest", show: true },
  { say: "core", zone: "fAbs", show: true }, { say: "elbows", zone: "fElbows", show: true }, { say: "wrists", zone: "fWrists", show: true },
  { say: "hips", zone: "fHips", show: true }, { say: "quadriceps", zone: "fThighs", show: true }, { say: "knees", zone: "fKnees", show: true },
  { say: "ankles", zone: "fAnkles", show: true },
  { say: "spine", zone: "bSpine", show: false }, { say: "shoulder blades", zone: "bBlades", show: false }, { say: "lower back", zone: "bLower", show: false },
  { say: "glutes", zone: "bGlutes", show: false }, { say: "hamstrings", zone: "bHams", show: false }, { say: "calves", zone: "bCalves", show: false },
  { say: "abs", zone: "fAbs", show: false }, { say: "thighs", zone: "fThighs", show: false }
];
var IPA = { "neck": "/nɛk/", "shoulders": "/ˈʃoʊldərz/", "chest": "/tʃɛst/", "core": "/kɔːr/", "elbows": "/ˈɛlboʊz/", "wrists": "/rɪsts/", "hips": "/hɪps/", "quadriceps": "/ˈkwɑːdrɪˌsɛps/", "knees": "/niːz/", "ankles": "/ˈæŋkəlz/", "spine": "/spaɪn/", "shoulder blades": "/ˈʃoʊldər bleɪdz/", "lower back": "/ˈloʊər bæk/", "glutes": "/gluːts/", "hamstrings": "/ˈhæmˌstrɪŋz/", "calves": "/kævz/", "abs": "/æbz/", "thighs": "/θaɪz/" };
function showWord(q) {
  var pr = document.getElementById('prompt'); pr.innerHTML = '';
  pr.appendChild(document.createTextNode('Tap the '));
  var card = el('span', 'wordcard', q.say);
  card.appendChild(el('span', 'ipa', IPA[q.say] || ''));
  pr.appendChild(card);
}
var idx = 0, score = 0, tries = 0, locked = false, revealed = false;

function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
function say(t) { try { var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.85; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) {} }
function setTop() { document.getElementById('stage').textContent = idx < PROMPTS.length ? 'Listen and tap (' + (idx + 1) + '/' + PROMPTS.length + ')' : 'Finished'; document.getElementById('score').textContent = 'Score: ' + score; }

var SVG = '<svg viewBox="0 0 480 380" id="map">' +
'<text class="lbl" x="120" y="14">FRONT</text><text class="lbl" x="360" y="14">BACK</text>' +
'<circle class="deco" cx="120" cy="36" r="20"/>' +
'<rect class="zone" data-zone="fNeck" x="112" y="55" width="16" height="13" rx="4"/>' +
'<rect class="zone" data-zone="fChest" x="100" y="70" width="40" height="38" rx="8"/>' +
'<ellipse class="zone" data-zone="fShoulders" cx="88" cy="78" rx="17" ry="10"/><ellipse class="zone" data-zone="fShoulders" cx="152" cy="78" rx="17" ry="10"/>' +
'<rect class="deco" x="72" y="86" width="14" height="38" rx="6"/><rect class="deco" x="154" y="86" width="14" height="38" rx="6"/>' +
'<circle class="zone" data-zone="fElbows" cx="79" cy="130" r="8"/><circle class="zone" data-zone="fElbows" cx="161" cy="130" r="8"/>' +
'<rect class="deco" x="71" y="138" width="14" height="34" rx="6"/><rect class="deco" x="155" y="138" width="14" height="34" rx="6"/>' +
'<circle class="zone" data-zone="fWrists" cx="78" cy="178" r="7"/><circle class="zone" data-zone="fWrists" cx="162" cy="178" r="7"/>' +
'<rect class="zone" data-zone="fAbs" x="102" y="110" width="36" height="44" rx="6"/>' +
'<rect class="zone" data-zone="fHips" x="98" y="156" width="44" height="22" rx="8"/>' +
'<rect class="zone" data-zone="fThighs" x="100" y="180" width="19" height="72" rx="8"/><rect class="zone" data-zone="fThighs" x="121" y="180" width="19" height="72" rx="8"/>' +
'<circle class="zone" data-zone="fKnees" cx="109" cy="260" r="10"/><circle class="zone" data-zone="fKnees" cx="131" cy="260" r="10"/>' +
'<rect class="deco" x="101" y="270" width="17" height="58" rx="7"/><rect class="deco" x="122" y="270" width="17" height="58" rx="7"/>' +
'<circle class="zone" data-zone="fAnkles" cx="109" cy="334" r="7"/><circle class="zone" data-zone="fAnkles" cx="131" cy="334" r="7"/>' +
'<ellipse class="deco" cx="107" cy="352" rx="12" ry="6"/><ellipse class="deco" cx="133" cy="352" rx="12" ry="6"/>' +
'<circle class="deco" cx="360" cy="36" r="20"/>' +
'<rect class="zone" data-zone="bNeck" x="352" y="55" width="16" height="13" rx="4"/>' +
'<ellipse class="deco" cx="328" cy="78" rx="17" ry="10"/><ellipse class="deco" cx="392" cy="78" rx="17" ry="10"/>' +
'<rect class="deco" x="312" y="86" width="14" height="86" rx="6"/><rect class="deco" x="394" y="86" width="14" height="86" rx="6"/>' +
'<rect class="zone" data-zone="bLower" x="338" y="126" width="44" height="30" rx="8"/>' +
'<ellipse class="zone" data-zone="bBlades" cx="346" cy="96" rx="12" ry="17"/><ellipse class="zone" data-zone="bBlades" cx="374" cy="96" rx="12" ry="17"/>' +
'<rect class="zone" data-zone="bSpine" x="356" y="70" width="8" height="84" rx="4"/>' +
'<ellipse class="zone" data-zone="bGlutes" cx="348" cy="170" rx="16" ry="14"/><ellipse class="zone" data-zone="bGlutes" cx="372" cy="170" rx="16" ry="14"/>' +
'<rect class="zone" data-zone="bHams" x="340" y="186" width="18" height="68" rx="8"/><rect class="zone" data-zone="bHams" x="362" y="186" width="18" height="68" rx="8"/>' +
'<circle class="deco" cx="349" cy="260" r="8"/><circle class="deco" cx="371" cy="260" r="8"/>' +
'<rect class="zone" data-zone="bCalves" x="341" y="270" width="16" height="56" rx="8"/><rect class="zone" data-zone="bCalves" x="363" y="270" width="16" height="56" rx="8"/>' +
'<ellipse class="deco" cx="349" cy="344" rx="11" ry="6"/><ellipse class="deco" cx="371" cy="344" rx="11" ry="6"/>' +
'</svg>';

function start() { idx = 0; score = 0; renderIntro(); }

function renderIntro() {
  var p = document.getElementById('panel'); p.innerHTML = ''; setTop();
  p.appendChild(el('div', 'big', '\u{1F9D8}'));
  p.appendChild(el('h2', '', 'Do you know your body in English?'));
  p.appendChild(el('p', '', 'You hear a word and tap the right body part. You can listen again as many times as you want. If you need help, press Show the word to see it with its IPA (you will not get the point). Wrong taps do not end the question.'));
  var b = el('button', '', 'Start'); b.onclick = nextQ; p.appendChild(b);
}

function nextQ() {
  var p = document.getElementById('panel'); p.innerHTML = '';
  if (idx >= PROMPTS.length) { renderEnd(); return; }
  var q = PROMPTS[idx]; tries = 0; locked = false; revealed = false; setTop();
  var pr = el('div', 'prompt'); pr.id = 'prompt';
  p.appendChild(pr);
  pr.textContent = 'Listen and tap'; pr.appendChild(el('small', '', 'Press the speaker to hear it again. Need help? Press Show the word.'));
  var holder = el('div'); holder.innerHTML = SVG; p.appendChild(holder);
  var fb = el('div', 'fb'); fb.id = 'fb'; p.appendChild(fb);
  var bar = el('div', 'bar');
  var sp = el('button', 'alt', '\u{1F50A} Listen'); sp.onclick = function () { say(q.say); };
  var show = el('button', 'alt', 'Show the word'); show.onclick = function () { revealed = true; showWord(q); show.className = 'hidden'; };
  var nx = el('button', 'hidden', idx === PROMPTS.length - 1 ? 'See my result' : 'Next'); nx.id = 'nx'; nx.onclick = function () { idx += 1; nextQ(); };
  bar.appendChild(sp); bar.appendChild(show); bar.appendChild(nx); p.appendChild(bar);
  document.getElementById('map').onclick = function (e) {
    var z = e.target.closest ? e.target.closest('[data-zone]') : null;
    if (!z || locked) return;
    var zone = z.getAttribute('data-zone');
    if (zone === q.zone) {
      locked = true;
      document.querySelectorAll('[data-zone="' + zone + '"]').forEach(function (s) { s.setAttribute('class', 'zone right'); });
      var pts = (tries === 0 && !revealed) ? 1 : 0;
      score += pts; setTop();
      showWord(q); fb.textContent = 'Yes! ' + NAMES[zone] + ' ' + (IPA[q.say] || '') + (pts ? '. +1 point' : '. Good, now you know it.'); fb.className = 'fb good';
      nx.className = ''; sp.className = 'alt';
    } else {
      tries += 1;
      var shapes = document.querySelectorAll('[data-zone="' + zone + '"]');
      shapes.forEach(function (s) { s.setAttribute('class', 'zone wrong'); });
      setTimeout(function () { shapes.forEach(function (s) { s.setAttribute('class', 'zone'); }); }, 600);
      fb.textContent = 'That is the ' + NAMES[zone] + '. Try again.'; fb.className = 'fb bad';
      if (tries >= 2) { document.querySelectorAll('[data-zone="' + q.zone + '"]').forEach(function (s) { s.setAttribute('class', 'zone pulse'); }); }
    }
  };
  setTimeout(function () { say(q.say); }, 300);
}

function renderEnd() {
  var p = document.getElementById('panel'); p.innerHTML = ''; setTop();
  var pct = score / PROMPTS.length;
  var title = pct >= 0.85 ? 'Yoga Teacher Level' : (pct >= 0.6 ? 'Flexible Learner' : 'Warming Up');
  var stars = pct >= 0.85 ? '⭐⭐⭐' : (pct >= 0.6 ? '⭐⭐' : '⭐');
  p.appendChild(el('div', 'big', stars));
  p.appendChild(el('h2', '', title));
  p.appendChild(el('p', '', 'You scored ' + score + ' out of ' + PROMPTS.length + '.'));
  p.appendChild(el('p', '', 'Next time you hear these words in your class, you will know exactly where to feel the stretch.'));
  var b = el('button', '', 'Play again'); b.onclick = start; p.appendChild(b);
}
start();
</script>
</body>
</html>
