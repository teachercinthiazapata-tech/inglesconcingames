<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Client Desk</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(135deg, #c9b6f0 0%, #b8c9f0 45%, #b6f0d8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    max-width: 640px;
    width: 100%;
    padding: 32px 30px;
    box-shadow: 0 12px 40px rgba(60, 40, 100, 0.18);
  }
  .progress { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #e2d9f5; transition: background 0.3s; }
  .dot.active { background: #9b7bd8; }
  .dot.done { background: #6fcf97; }
  h1 { text-align: center; font-size: 24px; color: #4a3b6b; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #7a6f95; font-size: 14px; margin-bottom: 16px; }
  .intro { text-align: center; color: #4a3b6b; line-height: 1.6; }
  .intro .big { font-size: 56px; margin: 8px 0; }
  .intro p { margin-bottom: 14px; }
  .scoreboard { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #7a6f95; margin-bottom: 12px; font-weight: 600; }
  .client-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .avatar { font-size: 48px; width: 70px; height: 70px; border-radius: 50%; background: #f5f2fc; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.3s; }
  .avatar.pop { animation: pop 0.6s ease; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-6deg); } 100% { transform: scale(1); } }
  .bubble { background: #f5f2fc; border-radius: 16px; padding: 14px 16px; color: #4a3b6b; font-size: 16px; line-height: 1.5; position: relative; flex: 1; }
  .client-name { font-size: 12px; color: #9b8fb8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px; }
  .mood { height: 12px; background: #e2d9f5; border-radius: 8px; overflow: hidden; margin-bottom: 4px; }
  .mood-fill { height: 100%; width: 15%; background: linear-gradient(90deg, #f2b3b3, #f2d98a, #6fcf97); transition: width 0.7s; }
  .mood-label { text-align: right; font-size: 12px; color: #9b8fb8; margin-bottom: 14px; }
  .task-line { text-align: center; font-weight: 600; color: #4a3b6b; margin-bottom: 12px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .option-btn {
    background: #efe8fb; border: 2px solid #e2d9f5; border-radius: 12px; padding: 14px 16px;
    font-size: 15px; color: #4a3b6b; cursor: pointer; text-align: left; transition: background 0.15s, border-color 0.15s;
  }
  .option-btn:hover { background: #e2d3f9; }
  .option-btn.correct { background: #d4f4e2; border-color: #6fcf97; color: #1e6b45; }
  .option-btn.wrong { background: #fbe2e2; border-color: #e79a9a; color: #a13a3a; }
  .option-btn:disabled { cursor: default; }
  .tile-pool, .tile-answer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 46px; margin-bottom: 14px; padding: 10px; border-radius: 12px; }
  .tile-pool { background: #f5f2fc; }
  .tile-answer { background: #fff; border: 2px dashed #d8cff0; }
  .tile { background: #9b7bd8; color: white; padding: 8px 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; user-select: none; }
  .tile:hover { background: #8a68c9; }
  .type-input { width: 100%; padding: 13px 14px; border: 2px solid #e2d9f5; border-radius: 12px; font-size: 16px; margin-bottom: 12px; text-align: center; }
  .type-input:focus { outline: none; border-color: #9b7bd8; }
  .clue-line { text-align: center; font-size: 22px; letter-spacing: 6px; color: #5b3fa0; font-weight: 700; margin-bottom: 14px; min-height: 30px; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { width: auto; flex: 1; }
  .btn { display: block; width: 100%; background: #6fcf97; color: white; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.15s; margin-bottom: 10px; }
  .btn:last-child { margin-bottom: 0; }
  .btn:hover { background: #5cbf85; }
  .btn:disabled { background: #b9e5cb; cursor: default; }
  .btn.secondary { background: #efe8fb; color: #5b3fa0; }
  .btn.secondary:hover { background: #ddd0f7; }
  .btn.secondary:disabled { background: #f3eefb; color: #b8aad6; }
  .feedback { text-align: center; font-size: 15px; font-weight: 600; margin: 12px 0; padding: 12px; border-radius: 12px; }
  .feedback.correct { background: #d4f4e2; color: #1e6b45; }
  .feedback.wrong { background: #fbe2e2; color: #a13a3a; }
  .hidden { display: none !important; }
  .score-screen { text-align: center; }
  .score-screen .stars { font-size: 40px; margin: 12px 0; letter-spacing: 6px; }
  .score-screen .big-score { font-size: 44px; font-weight: 800; color: #5b3fa0; margin: 8px 0; }
  .faces { font-size: 30px; margin: 8px 0 14px; }
  .footer { text-align: center; color: #9b8fb8; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>The Client Desk</h1>
  <div class="subtitle">First Conditional Game</div>

  <div id="introScreen" class="intro">
    <div class="big">&#128188;</div>
    <p>You are <b>Sofia</b>, a paralegal at Andes Migration Law.<br>Six clients need your help. Answer their questions and make them happy!</p>
    <p style="font-size:14px;color:#7a6f95;">No timer, no lives. Try as many times as you like.</p>
    <button class="btn" onclick="startGame()">Open the Desk</button>
  </div>

  <div id="gameArea" class="hidden">
    <div class="progress" id="progress"></div>
    <div class="scoreboard"><span id="happyCount">Happy clients: 0</span><span id="starCount">Stars: 0</span></div>
    <div class="client-row">
      <div class="avatar" id="avatar"></div>
      <div class="bubble"><div class="client-name" id="clientName"></div><div id="bubbleText"></div></div>
    </div>
    <div class="mood"><div class="mood-fill" id="moodFill"></div></div>
    <div class="mood-label" id="moodLabel">Client mood</div>
    <div class="task-line" id="taskLine"></div>
    <div id="mechanicArea"></div>
    <div class="feedback hidden" id="feedback"></div>
  </div>

  <div id="scoreScreen" class="score-screen hidden">
    <h1>Desk closed!</h1>
    <div class="faces" id="faces"></div>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="scoreCount">0 / 6</div>
    <p id="finalMsg" style="color:#6b5f8a; margin-bottom: 18px;"></p>
    <button class="btn" onclick="startGame()">Play Again</button>
  </div>

  <div class="footer">Inglés con Cin</div>
</div>

<script>
const clients = [
  {
    name: "Mr. Weber", face: "👨‍💼",
    says: "What happens if my documents are in German?",
    mechanic: "choice",
    task: "Choose the best answer.",
    options: [
      "If your documents are in German, you will need a sworn translation.",
      "If your documents will be in German, you will need a sworn translation.",
      "If your documents are in German, you are need a sworn translation."
    ],
    correctAnswer: "If your documents are in German, you will need a sworn translation.",
    tip: "After if we use the present simple (are), not will."
  },
  {
    name: "Ms. Rossi", face: "👩‍🦰",
    says: "What happens if I miss the deadline?",
    mechanic: "choice",
    task: "Choose the best answer.",
    options: [
      "If you miss the deadline, there will be a delay.",
      "If you will miss the deadline, there will be a delay.",
      "If you miss the deadline, there be a delay."
    ],
    correctAnswer: "If you miss the deadline, there will be a delay.",
    tip: "If + present simple (miss), then will + base verb (will be)."
  },
  {
    name: "Mr. Kim", face: "👴",
    says: "How will I know if my application is approved?",
    mechanic: "order",
    task: "Build the answer. Tap the words in order.",
    pieces: ["If", "it", "is", "approved", "we", "will", "call", "you"],
    tip: "If it is approved (present simple), we will call you (will + base verb)."
  },
  {
    name: "Ms. Silva", face: "👩",
    says: "Can you confirm my appointment?",
    mechanic: "order",
    task: "Build the answer. Tap the words in order.",
    pieces: ["If", "you", "reply", "to", "this", "email", "we", "will", "confirm", "your", "appointment"],
    tip: "The if part uses the present simple (reply). The result uses will confirm."
  },
  {
    name: "Mr. Novak", face: "🧔",
    says: "What will I get if everything is correct?",
    mechanic: "type",
    task: "Complete the answer. Use Clue if you need help.",
    before: "If everything is correct, you will",
    after: "your permit by mail.",
    answers: ["receive"],
    clueWord: "receive",
    tip: "will + base verb: you will receive."
  },
  {
    name: "Mrs. Haddad", face: "👩‍🦳",
    says: "Can you explain the steps, please?",
    mechanic: "order",
    task: "Put the steps in the correct order.",
    pieces: ["First, you send your documents", "Then we review them", "After that, we file the application", "Finally, you receive your permit"],
    tip: "Great explanation! First, then, after that, finally help the client follow each step."
  }
];

let current = 0;
let correctCount = 0;
let firstTryCount = 0;
let wrongAttempted = false;
let pool = [];
let placed = [];
let clueCount = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  current = 0;
  correctCount = 0;
  firstTryCount = 0;
  document.getElementById("introScreen").classList.add("hidden");
  document.getElementById("scoreScreen").classList.add("hidden");
  document.getElementById("gameArea").classList.remove("hidden");
  renderClient();
}

function buildProgress() {
  const el = document.getElementById("progress");
  el.innerHTML = "";
  for (let i = 0; i < clients.length; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i === current ? " active" : i < current ? " done" : "");
    el.appendChild(d);
  }
}

function showFeedback(kind, text) {
  const fb = document.getElementById("feedback");
  fb.classList.remove("hidden", "correct", "wrong");
  fb.classList.add(kind);
  fb.textContent = text;
}

function clearFeedback() {
  const fb = document.getElementById("feedback");
  fb.classList.add("hidden");
  fb.classList.remove("correct", "wrong");
}

function updateScoreboard() {
  document.getElementById("happyCount").textContent = "Happy clients: " + correctCount;
  document.getElementById("starCount").textContent = "Stars: " + firstTryCount;
}

function renderClient() {
  wrongAttempted = false;
  clearFeedback();
  buildProgress();
  updateScoreboard();
  const c = clients[current];
  document.getElementById("avatar").textContent = c.face;
  document.getElementById("clientName").textContent = c.name;
  document.getElementById("bubbleText").textContent = c.says;
  document.getElementById("moodFill").style.width = "15%";
  document.getElementById("moodLabel").textContent = "Client mood: waiting";
  document.getElementById("taskLine").textContent = c.task;
  const area = document.getElementById("mechanicArea");

  if (c.mechanic === "choice") {
    area.innerHTML = '<div class="options" id="optionsArea"></div>';
    const optionsArea = document.getElementById("optionsArea");
    shuffle(c.options).forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt;
      btn.onclick = () => checkChoice(opt, btn);
      optionsArea.appendChild(btn);
    });
  } else if (c.mechanic === "order") {
    pool = shuffle(c.pieces.map((val, idx) => ({ val: val, id: idx })));
    placed = [];
    area.innerHTML =
      '<div class="tile-answer" id="answerArea"></div>' +
      '<div class="tile-pool" id="poolArea"></div>' +
      '<div class="btn-row">' +
      '<button class="btn secondary" id="undoBtn" onclick="undoTile()">Undo</button>' +
      '<button class="btn secondary" id="clueBtn" onclick="giveClue()">Clue</button>' +
      '<button class="btn" id="checkBtn" onclick="checkTiles()">Check</button>' +
      '</div>';
    renderTiles();
  } else if (c.mechanic === "type") {
    clueCount = 0;
    area.innerHTML =
      '<div class="bubble" style="margin-bottom:12px;text-align:center;">' + c.before + ' ______ ' + c.after + '</div>' +
      '<div class="clue-line" id="clueLine"></div>' +
      '<input type="text" class="type-input" id="typeInput" placeholder="Type the missing word..." autocomplete="off">' +
      '<div class="btn-row">' +
      '<button class="btn secondary" id="typeClueBtn" onclick="typeClue()">Clue</button>' +
      '<button class="btn" id="typeCheckBtn" onclick="checkTyped()">Check</button>' +
      '</div>';
    document.getElementById("typeInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") checkTyped();
    });
    document.getElementById("typeInput").focus();
  }
}

function renderTiles() {
  const answerArea = document.getElementById("answerArea");
  const poolArea = document.getElementById("poolArea");
  answerArea.innerHTML = "";
  poolArea.innerHTML = "";
  placed.forEach(t => {
    const el = document.createElement("div");
    el.className = "tile";
    el.textContent = t.val;
    answerArea.appendChild(el);
  });
  pool.forEach(t => {
    const el = document.createElement("div");
    el.className = "tile";
    el.textContent = t.val;
    el.onclick = () => placeTile(t.id);
    poolArea.appendChild(el);
  });
}

function placeTile(id) {
  const idx = pool.findIndex(t => t.id === id);
  if (idx === -1) return;
  placed.push(pool[idx]);
  pool.splice(idx, 1);
  renderTiles();
}

function undoTile() {
  if (placed.length === 0) return;
  pool.push(placed.pop());
  renderTiles();
}

function giveClue() {
  const c = clients[current];
  if (placed.length >= c.pieces.length) return;
  const needed = c.pieces[placed.length];
  const idx = pool.findIndex(t => t.val === needed);
  if (idx === -1) return;
  placeTile(pool[idx].id);
}

function typeClue() {
  const c = clients[current];
  if (clueCount >= c.clueWord.length) return;
  clueCount++;
  const letters = c.clueWord.split("").map((ch, i) => i < clueCount ? ch : "_");
  document.getElementById("clueLine").textContent = letters.join(" ");
}

function happyClient() {
  const c = clients[current];
  const av = document.getElementById("avatar");
  av.textContent = wrongAttempted ? "🙂" : "😄";
  av.classList.remove("pop");
  void av.offsetWidth;
  av.classList.add("pop");
  document.getElementById("moodFill").style.width = wrongAttempted ? "75%" : "100%";
  document.getElementById("moodLabel").textContent = wrongAttempted ? "Client mood: happy" : "Client mood: delighted";
  correctCount++;
  if (!wrongAttempted) firstTryCount++;
  updateScoreboard();
  showFeedback("correct", "Correct! " + c.tip);
  setTimeout(nextClient, 2600);
}

function checkChoice(chosen, btn) {
  const c = clients[current];
  const allBtns = document.querySelectorAll("#optionsArea .option-btn");
  if (chosen === c.correctAnswer) {
    allBtns.forEach(b => b.disabled = true);
    btn.classList.add("correct");
    happyClient();
  } else {
    btn.classList.add("wrong");
    btn.disabled = true;
    wrongAttempted = true;
    document.getElementById("moodFill").style.width = "10%";
    document.getElementById("moodLabel").textContent = "Client mood: worried";
    showFeedback("wrong", "Not quite. Try another answer.");
  }
}

function checkTiles() {
  const c = clients[current];
  const attempt = placed.map(t => t.val).join(" ");
  const target = c.pieces.join(" ");
  if (attempt === target) {
    document.getElementById("checkBtn").disabled = true;
    document.getElementById("undoBtn").disabled = true;
    document.getElementById("clueBtn").disabled = true;
    happyClient();
  } else {
    wrongAttempted = true;
    document.getElementById("moodFill").style.width = "10%";
    document.getElementById("moodLabel").textContent = "Client mood: worried";
    showFeedback("wrong", "Not quite. Use Undo or Clue and try again.");
  }
}

function checkTyped() {
  const c = clients[current];
  const input = document.getElementById("typeInput");
  if (input.disabled) return;
  const value = input.value.trim().toLowerCase();
  if (c.answers.includes(value)) {
    input.disabled = true;
    document.getElementById("typeCheckBtn").disabled = true;
    document.getElementById("typeClueBtn").disabled = true;
    happyClient();
  } else {
    wrongAttempted = true;
    document.getElementById("moodFill").style.width = "10%";
    document.getElementById("moodLabel").textContent = "Client mood: worried";
    showFeedback("wrong", "Not quite. Try again or use Clue.");
  }
}

function nextClient() {
  current++;
  if (current >= clients.length) {
    showFinish();
  } else {
    renderClient();
  }
}

function showFinish() {
  document.getElementById("gameArea").classList.add("hidden");
  document.getElementById("scoreScreen").classList.remove("hidden");
  let stars = "";
  for (let i = 0; i < clients.length; i++) stars += i < firstTryCount ? "⭐" : "☆";
  document.getElementById("stars").textContent = stars;
  document.getElementById("faces").textContent = clients.map(c => c.face).join(" ");
  document.getElementById("scoreCount").textContent = firstTryCount + " / " + clients.length;
  let msg;
  if (firstTryCount === clients.length) msg = "Perfect! All six clients are delighted. You explain the process like a pro.";
  else if (firstTryCount >= 4) msg = "Great job! Your clients are happy. Play again to get every star.";
  else msg = "Good work! All your clients got their answers. Play again and collect more stars.";
  document.getElementById("finalMsg").textContent = msg;
}
</script>
</body>
</html>
